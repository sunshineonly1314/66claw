serverAddr = "106.15.198.253"
serverPort = 7000
# Do not commit the real FRP token. Copy this file to a local/private config
# and inject the token from a secret store or environment-specific deployment.
auth.token = "CHANGE_ME"

# Local webhook server -> Aliyun 9999 (Gitee webhook entry)
[[proxies]]
name = "webhook"
type = "tcp"
localIP = "127.0.0.1"
localPort = 8888
remotePort = 9999

# Local Windows SSH -> Aliyun 6022 (build server connects to Windows here)
[[proxies]]
name = "windows-ssh"
type = "tcp"
localIP = "127.0.0.1"
localPort = 22
remotePort = 6022

# Mac mini SSH -> Aliyun 6023 (requires frpc on the Mac mini)
# Keep that proxy in the Mac mini frpc config; not enabled here.
