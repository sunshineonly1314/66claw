name: Daily Upstream Sync

on:
  schedule:
    # Run at 02:00 UTC (10:00 CST) every day
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force sync even if no new upstream commits'
        required: false
        type: boolean
        default: false
      skip_tests:
        description: 'Skip post-merge test validation'
        required: false
        type: boolean
        default: false
      skip_analysis:
        description: 'Skip AI analysis of upstream changes'
        required: false
        type: boolean
        default: false
      full_ai_pipeline:
        description: 'Run full AI pipeline (analyze + merge + resolve conflicts + fix failures)'
        required: false
        type: boolean
        default: true
      max_fix_rounds:
        description: 'Max rounds for AI auto-fix (lint/build/test)'
        required: false
        type: number
        default: 3

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  UPSTREAM_REPO: openclaw/openclaw
  UPSTREAM_REF: main
  NODE_VERSION: '22'

jobs:
  # ============================================================
  # Job 1: Detect upstream changes
  # ============================================================
  detect:
    runs-on: ubuntu-latest
    outputs:
      commit_count: ${{ steps.analysis.outputs.commit_count }}
      has_changes: ${{ steps.analysis.outputs.has_changes }}
      diff_stat: ${{ steps.analysis.outputs.diff_stat }}
      section2_affected: ${{ steps.analysis.outputs.section2_affected }}
      section2_files: ${{ steps.analysis.outputs.section2_files }}
      merge_branch: ${{ steps.analysis.outputs.merge_branch }}
      merge_base: ${{ steps.analysis.outputs.merge_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" 2>/dev/null || true
          git fetch upstream ${{ env.UPSTREAM_REF }} --tags --prune

      - name: Analyze changes
        id: analysis
        run: |
          set -euo pipefail

          DATE=$(date +%Y-%m-%d)
          MERGE_BRANCH="merge/upstream-${DATE}"
          MERGE_BASE=$(git merge-base HEAD upstream/${{ env.UPSTREAM_REF }})
          COMMIT_COUNT=$(git rev-list --count "${MERGE_BASE}..upstream/${{ env.UPSTREAM_REF }}")

          echo "merge_branch=${MERGE_BRANCH}" >> "$GITHUB_OUTPUT"
          echo "merge_base=${MERGE_BASE}" >> "$GITHUB_OUTPUT"
          echo "commit_count=${COMMIT_COUNT}" >> "$GITHUB_OUTPUT"

          if [ "$COMMIT_COUNT" -eq 0 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No new upstream commits."
            exit 0
          fi
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

          # Diff stat (truncated for output)
          DIFF_STAT=$(git diff --stat "${MERGE_BASE}..upstream/${{ env.UPSTREAM_REF }}" | tail -1)
          echo "diff_stat=${DIFF_STAT}" >> "$GITHUB_OUTPUT"

          # Section II impact analysis
          SECTION2_FILES=(
            "src/config/defaults.ts"
            "src/config/auto-detect-env.ts"
            "src/agents/models-config.ts"
            "src/agents/models-config.providers.ts"
            "package.json"
            "AGENTS.md"
            "src/auto-reply/reply/get-reply.ts"
            "src/agents/model-fallback.ts"
            "src/media-understanding/providers/openai/index.ts"
            "src/media-understanding/defaults.ts"
            "src/media-understanding/attachments.ts"
            "src/config/types.agent-defaults.ts"
          )

          UPSTREAM_CHANGED=$(git diff --name-only "${MERGE_BASE}..upstream/${{ env.UPSTREAM_REF }}")
          AFFECTED_COUNT=0
          AFFECTED_LIST=""
          for f in "${SECTION2_FILES[@]}"; do
            if echo "$UPSTREAM_CHANGED" | grep -q "^${f}$"; then
              AFFECTED_COUNT=$((AFFECTED_COUNT + 1))
              AFFECTED_LIST="${AFFECTED_LIST}${f},"
            fi
          done

          echo "section2_affected=${AFFECTED_COUNT}" >> "$GITHUB_OUTPUT"
          echo "section2_files=${AFFECTED_LIST}" >> "$GITHUB_OUTPUT"

          echo "### Upstream Analysis" >> "$GITHUB_STEP_SUMMARY"
          echo "- **New commits**: ${COMMIT_COUNT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Stats**: ${DIFF_STAT}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Section II files affected**: ${AFFECTED_COUNT}" >> "$GITHUB_STEP_SUMMARY"

  # ============================================================
  # Job 2: AI Analysis of upstream changes
  # ============================================================
  analyze:
    needs: detect
    if: needs.detect.outputs.has_changes == 'true' && inputs.skip_analysis != true
    runs-on: ubuntu-latest
    outputs:
      risk_level: ${{ steps.analyze.outputs.risk_level }}
      recommendation: ${{ steps.analyze.outputs.recommendation }}
      report_generated: ${{ steps.analyze.outputs.report_generated }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" 2>/dev/null || true
          git fetch upstream ${{ env.UPSTREAM_REF }} --tags --prune

      - name: Collect analysis data
        id: collect
        run: |
          set -euo pipefail
          bash scripts/autopipeline/analyze-upstream-diff.sh \
            --merge-base=${{ needs.detect.outputs.merge_base }} \
            --upstream-ref=upstream/${{ env.UPSTREAM_REF }}

      - name: AI analysis
        id: analyze
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          ANALYSIS_DIR=$(ls -d .upstream-analysis/*/ 2>/dev/null | sort -r | head -1)

          if [ -z "$ANALYSIS_DIR" ]; then
            echo "No analysis data found"
            echo "risk_level=unknown" >> "$GITHUB_OUTPUT"
            echo "recommendation=manual-review" >> "$GITHUB_OUTPUT"
            echo "report_generated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract risk level from manifest (available even without AI)
          RISK_LEVEL=$(python3 -c "import json; print(json.load(open('${ANALYSIS_DIR}/manifest.json'))['risk']['level'])" 2>/dev/null || echo "unknown")
          RECOMMENDATION=$(python3 -c "import json; print(json.load(open('${ANALYSIS_DIR}/manifest.json'))['risk']['recommendation'])" 2>/dev/null || echo "manual-review")

          echo "risk_level=${RISK_LEVEL}" >> "$GITHUB_OUTPUT"
          echo "recommendation=${RECOMMENDATION}" >> "$GITHUB_OUTPUT"

          # Try AI analysis (non-fatal if no API key)
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            if bash scripts/autopipeline/ai-analyze-upstream.sh --input-dir="${ANALYSIS_DIR}"; then
              echo "report_generated=true" >> "$GITHUB_OUTPUT"
              echo "### AI Analysis Report Generated" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Risk level**: ${RISK_LEVEL}" >> "$GITHUB_STEP_SUMMARY"
              echo "- **Recommendation**: ${RECOMMENDATION}" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "report_generated=false" >> "$GITHUB_OUTPUT"
              echo "AI analysis failed (non-fatal)" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "report_generated=false" >> "$GITHUB_OUTPUT"
            echo "### Structured Analysis (no AI)" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Risk level**: ${RISK_LEVEL}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Recommendation**: ${RECOMMENDATION}" >> "$GITHUB_STEP_SUMMARY"
            echo "- Set ANTHROPIC_API_KEY secret to enable AI analysis" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload analysis artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-analysis-${{ needs.detect.outputs.merge_branch }}
          path: |
            .upstream-analysis/
            docs/upstream-reports/
          retention-days: 30

  # ============================================================
  # Job 3: Attempt merge
  # ============================================================
  merge:
    needs: [detect, analyze]
    if: always() && needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    outputs:
      merge_success: ${{ steps.merge.outputs.success }}
      conflict_files: ${{ steps.merge.outputs.conflict_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Setup merge driver
        run: |
          git config merge.ours.name "Always keep CN version"
          git config merge.ours.driver true

      - name: Fetch upstream
        run: |
          git remote add upstream "https://github.com/${{ env.UPSTREAM_REPO }}.git" 2>/dev/null || true
          git fetch upstream ${{ env.UPSTREAM_REF }} --tags --prune

      - name: Attempt merge
        id: merge
        run: |
          set -euo pipefail

          BRANCH="${{ needs.detect.outputs.merge_branch }}"

          # Create merge branch
          git checkout -b "${BRANCH}"

          COMMIT_COUNT="${{ needs.detect.outputs.commit_count }}"
          SECTION2="${{ needs.detect.outputs.section2_affected }}"
          RISK_LEVEL="${{ needs.analyze.outputs.risk_level || 'unknown' }}"

          MERGE_MSG="chore: merge upstream $(date +%Y-%m-%d) (${COMMIT_COUNT} commits)

          Upstream commits: ${COMMIT_COUNT}
          Section II files affected: ${SECTION2}
          Risk level: ${RISK_LEVEL}
          Merge-base: ${{ needs.detect.outputs.merge_base }}
          Triggered by: GitHub Actions daily-upstream-sync"

          if git merge upstream/${{ env.UPSTREAM_REF }} --no-edit -m "$MERGE_MSG" 2>&1; then
            echo "success=true" >> "$GITHUB_OUTPUT"
            echo "conflict_files=" >> "$GITHUB_OUTPUT"

            # Apply brand rename if script exists
            if [ -f scripts/autopipeline/apply-cn-brand.sh ]; then
              echo "Applying CN brand rename..."
              if bash scripts/autopipeline/apply-cn-brand.sh; then
                if [ -n "$(git status --porcelain)" ]; then
                  git add -A
                  git commit -m "chore: apply CN brand rename (OpenClaw → OpenClawCN)

          Automated brand rename after upstream merge.
          Applied by: scripts/autopipeline/apply-cn-brand.sh in CI"
                  echo "Brand rename applied"
                fi
              else
                echo "Brand rename failed (non-fatal)"
              fi
            fi

            # Push the merge branch
            git push origin "${BRANCH}" --force-with-lease
          else
            echo "Merge has conflicts. Attempting AI resolution..."
            CONFLICTS=$(git diff --name-only --diff-filter=U 2>/dev/null | tr '\n' ',' || echo "unknown")

            # Try AI conflict resolution if API key available
            if [ -n "$ANTHROPIC_API_KEY" ] && [ -f scripts/autopipeline/agent-resolve-conflicts.sh ]; then
              echo "Running AI conflict resolver..."
              if bash scripts/autopipeline/agent-resolve-conflicts.sh 2>&1; then
                # Check if all conflicts resolved
                REMAINING=$(git diff --name-only --diff-filter=U 2>/dev/null | wc -l | tr -d ' ')
                if [ "$REMAINING" -eq 0 ]; then
                  git merge --continue --no-edit 2>/dev/null || git commit --no-edit 2>/dev/null || true
                  echo "success=true" >> "$GITHUB_OUTPUT"
                  echo "conflict_files=" >> "$GITHUB_OUTPUT"
                  echo "AI resolved all conflicts"

                  # Apply brand rename
                  if [ -f scripts/autopipeline/apply-cn-brand.sh ]; then
                    bash scripts/autopipeline/apply-cn-brand.sh || true
                    if [ -n "$(git status --porcelain)" ]; then
                      git add -A
                      git commit -m "chore: apply CN brand rename after AI conflict resolution"
                    fi
                  fi

                  git push origin "${BRANCH}" --force-with-lease
                else
                  echo "success=false" >> "$GITHUB_OUTPUT"
                  echo "conflict_files=${CONFLICTS}" >> "$GITHUB_OUTPUT"
                  echo "AI resolved some but ${REMAINING} conflicts remain"
                  git merge --abort 2>/dev/null || true
                fi
              else
                echo "success=false" >> "$GITHUB_OUTPUT"
                echo "conflict_files=${CONFLICTS}" >> "$GITHUB_OUTPUT"
                git merge --abort 2>/dev/null || true
              fi
            else
              echo "success=false" >> "$GITHUB_OUTPUT"
              echo "conflict_files=${CONFLICTS}" >> "$GITHUB_OUTPUT"
              git merge --abort
            fi
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  # ============================================================
  # Job 4: Validate merge
  # ============================================================
  validate:
    needs: [detect, merge]
    if: needs.merge.outputs.merge_success == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      validation_passed: ${{ steps.validate.outputs.passed }}
    steps:
      - name: Checkout merge branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.merge_branch }}
          fetch-depth: 1
          submodules: false

      - name: Checkout submodules (retry)
        run: |
          set -euo pipefail
          git submodule sync --recursive
          for attempt in 1 2 3 4 5; do
            if git -c protocol.version=2 submodule update --init --force --depth=1 --recursive; then
              exit 0
            fi
            echo "Submodule update failed (attempt $attempt/5). Retrying…"
            sleep $((attempt * 10))
          done
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        env:
          CI: true
        run: |
          pnpm install --frozen-lockfile --ignore-scripts=false --config.engine-strict=false --config.enable-pre-post-scripts=true

      - name: CN integrity check
        id: cn-integrity
        run: |
          set -euo pipefail
          echo "### CN Integrity Check" >> "$GITHUB_STEP_SUMMARY"

          CRITICAL_FILES=(
            "src/config/region-cn.ts"
            "src/config/cn-mirrors.ts"
            "src/config/defaults-cn.test.ts"
            "src/i18n/locales/zh-CN.ts"
            "ui/src/ui/i18n/locales/zh-CN.ts"
            "ui/src/ui/views/channels.feishu.ts"
            "config/dispatch.yaml"
            "config/cn-protected-files.json"
            ".github/workflows/build-macos-cn.yml"
            "docs/china-localization.md"
          )

          MISSING=0
          for f in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$f" ]; then
              echo "- MISSING: $f" >> "$GITHUB_STEP_SUMMARY"
              MISSING=$((MISSING + 1))
            fi
          done

          if [ "$MISSING" -gt 0 ]; then
            echo "::error::${MISSING} critical CN files missing after merge!"
            exit 1
          fi
          echo "- All ${#CRITICAL_FILES[@]} critical CN files present" >> "$GITHUB_STEP_SUMMARY"

      - name: Run validation
        id: validate
        if: inputs.skip_tests != true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail

          echo "Running lint..."
          if ! pnpm lint; then
            echo "Lint failed. Attempting auto-fix..."
            pnpm lint:fix || true
            if ! pnpm lint; then
              if [ -n "$ANTHROPIC_API_KEY" ] && [ -f scripts/autopipeline/agent-fix-failures.sh ]; then
                echo "Running AI lint fixer..."
                bash scripts/autopipeline/agent-fix-failures.sh --lint-only --max-rounds=2 || true
              fi
              # Final check
              if ! pnpm lint; then
                echo "::error::Lint still failing after AI fix attempt"
                echo "passed=false" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi
            # Commit lint fixes
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "fix: auto-fix lint errors after upstream merge"
              git push origin "${{ needs.detect.outputs.merge_branch }}" --force-with-lease
            fi
          fi

          echo "Running build..."
          if ! pnpm build; then
            if [ -n "$ANTHROPIC_API_KEY" ] && [ -f scripts/autopipeline/agent-fix-failures.sh ]; then
              echo "Build failed. Running AI build fixer..."
              bash scripts/autopipeline/agent-fix-failures.sh --build-only --max-rounds=2 || true
            fi
            if ! pnpm build; then
              echo "::error::Build still failing after AI fix attempt"
              echo "passed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "fix: auto-fix build errors after upstream merge"
              git push origin "${{ needs.detect.outputs.merge_branch }}" --force-with-lease
            fi
          fi

          echo "Running tests..."
          if ! pnpm test; then
            if [ -n "$ANTHROPIC_API_KEY" ] && [ -f scripts/autopipeline/agent-fix-failures.sh ]; then
              echo "Tests failed. Running AI test fixer..."
              bash scripts/autopipeline/agent-fix-failures.sh --test-only --max-rounds=2 || true
            fi
            if ! pnpm test; then
              echo "::error::Tests still failing after AI fix attempt"
              echo "passed=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if [ -n "$(git status --porcelain)" ]; then
              git add -A
              git commit -m "fix: auto-fix test failures after upstream merge"
              git push origin "${{ needs.detect.outputs.merge_branch }}" --force-with-lease
            fi
          fi

          echo "passed=true" >> "$GITHUB_OUTPUT"
          echo "### Validation Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Lint: ✓" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: ✓" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tests: ✓" >> "$GITHUB_STEP_SUMMARY"

      - name: Skip tests (manual override)
        if: inputs.skip_tests == true
        id: validate-skip
        run: |
          echo "Tests skipped by manual override"
          echo "passed=true" >> "$GITHUB_OUTPUT"

  # ============================================================
  # Job 5: Report results
  # ============================================================
  report:
    needs: [detect, analyze, merge, validate]
    if: always() && needs.detect.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Download analysis artifacts
        if: needs.analyze.outputs.report_generated == 'true'
        uses: actions/download-artifact@v4
        with:
          name: upstream-analysis-${{ needs.detect.outputs.merge_branch }}
          path: .analysis-artifacts/
        continue-on-error: true

      - name: Create PR on success
        if: needs.merge.outputs.merge_success == 'true' && (needs.validate.outputs.validation_passed == 'true' || inputs.skip_tests == true)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ needs.detect.outputs.merge_branch }}"
          COMMIT_COUNT="${{ needs.detect.outputs.commit_count }}"
          SECTION2="${{ needs.detect.outputs.section2_affected }}"
          SECTION2_FILES="${{ needs.detect.outputs.section2_files }}"
          RISK_LEVEL="${{ needs.analyze.outputs.risk_level || 'unknown' }}"
          RECOMMENDATION="${{ needs.analyze.outputs.recommendation || 'unknown' }}"
          AI_REPORT="${{ needs.analyze.outputs.report_generated || 'false' }}"

          # Try to include AI analysis summary in PR body
          AI_SUMMARY=""
          if [ -f ".analysis-artifacts/docs/upstream-reports/$(date +%Y-%m-%d).md" ]; then
            # Extract just the summary section (first 50 lines)
            AI_SUMMARY=$(head -60 ".analysis-artifacts/docs/upstream-reports/$(date +%Y-%m-%d).md" | tail -55)
          fi

          BODY="$(cat <<EOF
          ## Upstream Merge Report

          | Metric | Value |
          |--------|-------|
          | Upstream commits | ${COMMIT_COUNT} |
          | Stats | ${{ needs.detect.outputs.diff_stat }} |
          | Section II files affected | ${SECTION2} |
          | Risk level | \`${RISK_LEVEL}\` |
          | AI recommendation | \`${RECOMMENDATION}\` |
          | AI report | ${AI_REPORT} |
          | CN integrity | Passed |
          | CI validation | Passed |

          ### Section II Files (manual review recommended)
          $(echo "$SECTION2_FILES" | tr ',' '\n' | sed '/^$/d' | sed 's/^/- /')

          ### AI Analysis Summary
          ${AI_SUMMARY:-_AI analysis not available. Set ANTHROPIC_API_KEY secret to enable._}

          ### Checklist
          - [ ] Section II files reviewed for CN injection preservation
          - [ ] Brand consistency verified
          - [ ] AI analysis report reviewed (check workflow artifacts)
          - [ ] Smoke test on local dev environment

          ---
          *Auto-generated by daily-upstream-sync with AI analysis*
          EOF
          )"

          gh pr create \
            --base master \
            --head "${BRANCH}" \
            --title "chore: merge upstream $(date +%Y-%m-%d) (${COMMIT_COUNT} commits)" \
            --body "$BODY" \
            --label "upstream-sync" || echo "PR may already exist"

      - name: Create Issue on failure
        if: needs.merge.outputs.merge_success == 'false' || (needs.validate.outputs.validation_passed != 'true' && inputs.skip_tests != true)
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_COUNT="${{ needs.detect.outputs.commit_count }}"
          MERGE_SUCCESS="${{ needs.merge.outputs.merge_success }}"
          CONFLICTS="${{ needs.merge.outputs.conflict_files }}"

          if [ "$MERGE_SUCCESS" == "false" ]; then
            TITLE="Upstream sync failed: merge conflicts ($(date +%Y-%m-%d))"
            BODY="$(cat <<EOF
          ## Merge Conflict Report

          **Upstream commits**: ${COMMIT_COUNT}
          **Status**: Merge failed — manual resolution required

          ### Conflicting files
          $(echo "$CONFLICTS" | tr ',' '\n' | sed '/^$/d' | sed 's/^/- `/' | sed 's/$/`/')

          ### Resolution steps
          1. \`git fetch upstream main\`
          2. \`git checkout -b merge/upstream-$(date +%Y-%m-%d)-manual\`
          3. \`git merge upstream/main\`
          4. Resolve conflicts (keep CN modifications in Section II files)
          5. \`git add . && git merge --continue\`
          6. \`bash scripts/merge-upstream.sh --skip-tests\` to validate

          ---
          *Auto-generated by daily-upstream-sync*
          EOF
          )"
          else
            TITLE="Upstream sync failed: CI validation ($(date +%Y-%m-%d))"
            BODY="$(cat <<EOF
          ## Validation Failure Report

          **Upstream commits**: ${COMMIT_COUNT}
          **Status**: Merge succeeded but CI validation failed

          ### Next steps
          1. Check the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          2. Checkout the merge branch: \`git fetch origin ${{ needs.detect.outputs.merge_branch }} && git checkout ${{ needs.detect.outputs.merge_branch }}\`
          3. Fix failures locally
          4. Push fixes and re-run validation

          ---
          *Auto-generated by daily-upstream-sync*
          EOF
          )"
          fi

          gh issue create \
            --title "$TITLE" \
            --body "$BODY" \
            --label "upstream-sync,needs-attention" || echo "Issue creation failed"

      - name: Send Feishu notification
        if: always() && env.FEISHU_WEBHOOK != ''
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          COMMIT_COUNT="${{ needs.detect.outputs.commit_count }}"
          MERGE_SUCCESS="${{ needs.merge.outputs.merge_success }}"
          RISK_LEVEL="${{ needs.analyze.outputs.risk_level || 'n/a' }}"
          AI_REPORT="${{ needs.analyze.outputs.report_generated || 'n/a' }}"

          if [ "$MERGE_SUCCESS" == "true" ]; then
            STATUS="Merged successfully (risk: ${RISK_LEVEL})"
            COLOR="green"
          else
            STATUS="FAILED — manual intervention needed"
            COLOR="red"
          fi

          curl -s -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d "{
              \"msg_type\": \"interactive\",
              \"card\": {
                \"header\": {
                  \"title\": {\"tag\": \"plain_text\", \"content\": \"Upstream Sync: ${STATUS}\"},
                  \"template\": \"${COLOR}\"
                },
                \"elements\": [{
                  \"tag\": \"div\",
                  \"text\": {
                    \"tag\": \"lark_md\",
                    \"content\": \"**Commits**: ${COMMIT_COUNT}\\n**Section II affected**: ${{ needs.detect.outputs.section2_affected }}\\n**Run**: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\"
                  }
                }]
              }
            }" || echo "Feishu notification failed (non-fatal)"

  # ============================================================
  # No changes — skip
  # ============================================================
  no-changes:
