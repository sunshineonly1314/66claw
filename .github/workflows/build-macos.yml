name: Build macOS Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '2026.1.30'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            node_arch: arm64
          - arch: x64
            runner: macos-15
            node_arch: x64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.arch }}
    timeout-minutes: 45

    env:
      VERSION: ${{ github.event.inputs.version || '2026.1.30' }}
      NODE_VERSION: '22.13.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts=false || pnpm install --ignore-scripts=false

      - name: Build project
        run: pnpm build

      - name: Verify build output
        run: |
          echo "=== Checking critical files ==="
          echo "Source file exists:"
          ls -la src/commands/auth-choice.apply.github-copilot.ts || echo "SOURCE NOT FOUND!"
          
          echo ""
          echo "Compiled file exists:"
          ls -la dist/commands/auth-choice.apply.github-copilot.js || echo "COMPILED FILE NOT FOUND!"
          
          echo ""
          echo "All auth-choice files in dist/commands:"
          ls -la dist/commands/auth-choice* | wc -l
          ls dist/commands/auth-choice*.js
          
          echo ""
          echo "Total files in dist/commands:"
          ls dist/commands/*.js | wc -l

      - name: Download Node.js for packaging
        run: |
          NODE_URL="https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          echo "Downloading: $NODE_URL"
          curl -fsSL "$NODE_URL" -o node.tar.gz
          mkdir -p node-pkg
          tar -xzf node.tar.gz -C node-pkg --strip-components=1

      - name: Create package structure
        run: |
          set -x
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/app"
          mkdir -p "$PKG_DIR/node"
          mkdir -p "$PKG_DIR/config"
          
          # Copy Node.js (only essential files)
          mkdir -p "$PKG_DIR/node/bin"
          mkdir -p "$PKG_DIR/node/lib"
          cp node-pkg/bin/node "$PKG_DIR/node/bin/"
          cp -r node-pkg/lib/node_modules "$PKG_DIR/node/lib/" 2>/dev/null || true
          
          # 清理 Node.js 中的不必要文件
          rm -rf "$PKG_DIR/node/include" 2>/dev/null || true
          rm -rf "$PKG_DIR/node/share" 2>/dev/null || true
          find "$PKG_DIR/node" -name "*.md" -delete 2>/dev/null || true
          find "$PKG_DIR/node" -name "*.html" -delete 2>/dev/null || true
          find "$PKG_DIR/node" -name "CHANGELOG*" -delete 2>/dev/null || true
          find "$PKG_DIR/node" -name "LICENSE*" -delete 2>/dev/null || true
          
          echo "Node.js size:"
          du -sh "$PKG_DIR/node"
          
          # Copy app dist
          cp -r dist "$PKG_DIR/app/"
          
          # Create simplified package.json
          node -e "
            const pkg = require('./package.json');
            const newPkg = {
              name: pkg.name,
              version: pkg.version,
              type: pkg.type,
              main: pkg.main,
              dependencies: pkg.dependencies
            };
            console.log(JSON.stringify(newPkg, null, 2));
          " > "$PKG_DIR/app/package.json"
          
          # Copy extensions if exists (optional, without node_modules)
          if [ -d "extensions" ]; then
            echo "Copying extensions (excluding node_modules)..."
            mkdir -p "$PKG_DIR/extensions"
            # 只复制源代码文件，不包含 node_modules
            rsync -av --exclude='node_modules' --exclude='*.test.ts' --exclude='.git' extensions/ "$PKG_DIR/extensions/" 2>/dev/null || \
            find extensions -maxdepth 2 -type f \( -name "*.ts" -o -name "*.js" -o -name "*.json" -o -name "*.md" \) -exec cp --parents {} "$PKG_DIR/" \; 2>/dev/null || true
          fi
          
          # Copy sandbox config (optional)
          if [ -f "build/config/sandbox-mac.json" ]; then
            cp build/config/sandbox-mac.json "$PKG_DIR/config/"
          else
            echo '{"mode": "soft"}' > "$PKG_DIR/config/sandbox-mac.json"
          fi
          
          echo "Package structure created:"
          ls -la "$PKG_DIR/"
          
          # Debug: verify critical files after copy
          echo "=== Verifying critical files after copy ==="
          echo "auth-choice files in $PKG_DIR/app/dist/commands:"
          ls -la "$PKG_DIR/app/dist/commands/auth-choice"* | wc -l
          ls "$PKG_DIR/app/dist/commands/auth-choice"*.js
          echo ""
          echo "Checking github-copilot file specifically:"
          ls -la "$PKG_DIR/app/dist/commands/auth-choice.apply.github-copilot.js" || echo "FILE NOT FOUND IN PACKAGE!"

      - name: Install production dependencies
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          cd "$PKG_DIR/app"
          
          # 创建精简的 package.json，排除可选和大型依赖
          node -e "
            const pkg = require('./package.json');
            // 排除可选依赖和大型依赖
            const excludeDeps = [
              'node-llama-cpp',       // 非常大的 LLM 库
              '@napi-rs/canvas',      // 原生二进制
              'playwright-core',      // 浏览器二进制
              '@lydell/node-pty',     // 原生 pty
              'sqlite-vec',           // 原生扩展
              'sharp'                 // 图像处理原生模块
            ];
            const deps = {...pkg.dependencies};
            excludeDeps.forEach(d => delete deps[d]);
            pkg.dependencies = deps;
            delete pkg.optionalDependencies;
            console.log(JSON.stringify(pkg, null, 2));
          " > package.json.tmp && mv package.json.tmp package.json
          
          # 使用打包的 Node.js 安装生产依赖
          # Note: do not omit optional - clipboard and other modules need platform-specific binaries
          echo "Installing production dependencies..."
          ../../node-pkg/bin/npm install --omit=dev --ignore-scripts --no-audit --no-fund 2>&1 || true
          
          # 激进清理 node_modules
          echo "=== Aggressive cleanup of node_modules ==="
          
          # 删除所有不必要的文件类型
          find node_modules -name "*.md" -delete 2>/dev/null || true
          find node_modules -name "*.ts" ! -name "*.d.ts" -delete 2>/dev/null || true
          find node_modules -name "*.map" -delete 2>/dev/null || true
          find node_modules -name "*.min.js.map" -delete 2>/dev/null || true
          find node_modules -name "LICENSE*" -delete 2>/dev/null || true
          find node_modules -name "CHANGELOG*" -delete 2>/dev/null || true
          find node_modules -name "HISTORY*" -delete 2>/dev/null || true
          find node_modules -name "CONTRIBUTING*" -delete 2>/dev/null || true
          find node_modules -name "AUTHORS*" -delete 2>/dev/null || true
          find node_modules -name ".npmignore" -delete 2>/dev/null || true
          find node_modules -name ".eslint*" -delete 2>/dev/null || true
          find node_modules -name ".prettier*" -delete 2>/dev/null || true
          find node_modules -name ".editorconfig" -delete 2>/dev/null || true
          find node_modules -name "tsconfig*.json" -delete 2>/dev/null || true
          find node_modules -name "*.gyp" -delete 2>/dev/null || true
          find node_modules -name "*.gypi" -delete 2>/dev/null || true
          find node_modules -name "Makefile*" -delete 2>/dev/null || true
          find node_modules -name "*.yml" -delete 2>/dev/null || true
          find node_modules -name "*.yaml" ! -path "*/yaml/*" -delete 2>/dev/null || true
          find node_modules -name "binding.gyp" -delete 2>/dev/null || true
          find node_modules -name "*.c" -delete 2>/dev/null || true
          find node_modules -name "*.cpp" -delete 2>/dev/null || true
          find node_modules -name "*.h" -delete 2>/dev/null || true
          find node_modules -name "*.hpp" -delete 2>/dev/null || true
          find node_modules -name "*.o" -delete 2>/dev/null || true
          
          # 删除不必要的目录
          find node_modules -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "__tests__" -exec rm -rf {} + 2>/dev/null || true
          # Note: keep yaml's doc directory as it contains required runtime files
          find node_modules -type d -name "docs" ! -path "*/yaml/*" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "doc" ! -path "*/yaml/*" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "example" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "examples" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "coverage" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name ".github" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name ".vscode" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "benchmark" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "benchmarks" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "fixtures" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "android" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "ios" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "windows" -exec rm -rf {} + 2>/dev/null || true
          find node_modules -type d -name "prebuilds" -exec rm -rf {} + 2>/dev/null || true
          
          # 删除不需要的架构特定二进制
          CURRENT_ARCH="${{ matrix.arch }}"
          if [ "$CURRENT_ARCH" = "arm64" ]; then
            find node_modules -type d -name "darwin-x64" -exec rm -rf {} + 2>/dev/null || true
            find node_modules -type d -name "linux*" -exec rm -rf {} + 2>/dev/null || true
            find node_modules -type d -name "win32*" -exec rm -rf {} + 2>/dev/null || true
          else
            find node_modules -type d -name "darwin-arm64" -exec rm -rf {} + 2>/dev/null || true
            find node_modules -type d -name "linux*" -exec rm -rf {} + 2>/dev/null || true
            find node_modules -type d -name "win32*" -exec rm -rf {} + 2>/dev/null || true
          fi
          
          # 删除 .bin 目录中的符号链接（不需要）
          rm -rf node_modules/.bin 2>/dev/null || true
          
          # 删除空目录
          find node_modules -type d -empty -delete 2>/dev/null || true
          
          cd ../..
          
          # Debug: verify files after npm install
          echo "=== Verifying files after npm install ==="
          echo "auth-choice files in $PKG_DIR/app/dist/commands:"
          ls "$PKG_DIR/app/dist/commands/auth-choice"*.js | wc -l
          echo "github-copilot file:"
          ls -la "$PKG_DIR/app/dist/commands/auth-choice.apply.github-copilot.js" || echo "FILE DELETED BY NPM INSTALL!"
          
          # 显示大小
          echo "=== Package size after cleanup ==="
          du -sh "$PKG_DIR"
          du -sh "$PKG_DIR/app/node_modules" 2>/dev/null || true
          
          # 列出最大的包
          echo "=== Top 20 largest packages ==="
          du -sh "$PKG_DIR/app/node_modules"/* 2>/dev/null | sort -hr | head -20 || true

      - name: Create launcher scripts
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          
          # CLI launcher
          cat > "$PKG_DIR/clawbotcn" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$SCRIPT_DIR/node/bin:$PATH"
          cd "$SCRIPT_DIR/app"
          exec node dist/entry.js "$@"
          EOF
          chmod +x "$PKG_DIR/clawbotcn"
          
          # GUI launcher
          cat > "$PKG_DIR/start-gui.command" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$SCRIPT_DIR/node/bin:$PATH"
          echo "Starting ClawbotCN Gateway..."
          echo "URL: http://localhost:18789"
          (sleep 2 && open "http://localhost:18789/setup") &
          cd "$SCRIPT_DIR/app"
          exec node dist/entry.js gateway run --port 18789
          EOF
          chmod +x "$PKG_DIR/start-gui.command"
          
          # Install helper
          cat > "$PKG_DIR/install.sh" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Removing quarantine..."
          xattr -cr "$SCRIPT_DIR"
          chmod +x "$SCRIPT_DIR/clawbotcn"
          chmod +x "$SCRIPT_DIR/start-gui.command"
          chmod +x "$SCRIPT_DIR/node/bin/node"
          echo "Done! Double-click start-gui.command to run."
          EOF
          chmod +x "$PKG_DIR/install.sh"

      - name: Create version.json
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          cat > "$PKG_DIR/version.json" << EOF
          {
            "version": "$VERSION",
            "variant": "lite",
            "platform": "darwin",
            "arch": "${{ matrix.arch }}",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "nodeVersion": "$NODE_VERSION"
          }
          EOF

      - name: Create ZIP
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          ZIP_NAME="ClawbotCN-macOS-v$VERSION-${{ matrix.arch }}.zip"
          
          # Debug: verify file exists before ZIP
          echo "=== Verifying file before ZIP ==="
          ls -la "$PKG_DIR/app/dist/commands/auth-choice.apply.github-copilot.js" || echo "FILE MISSING BEFORE ZIP!"
          echo ""
          echo "All auth-choice.apply files:"
          ls -la "$PKG_DIR/app/dist/commands/auth-choice.apply"*.js | head -15
          echo ""
          
          # 显示最终大小
          echo "=== Final package contents ==="
          du -sh "$PKG_DIR"/*
          
          # 创建压缩包，排除不必要的文件
          # Note: Using specific patterns to avoid excluding github-* files
          zip -r "$ZIP_NAME" "$PKG_DIR" \
            -x "*.DS_Store" \
            -x "*/.git/*" \
            -x "*/.git" \
            -x "*/.gitignore" \
            -x "*/.gitattributes" \
            -x "*/.gitmodules" \
            -x "*.npm*" \
            -x "*/.cache/*" \
            -x "*/node_modules/.cache/*"
          
          # 校验和
          shasum -a 256 "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"
          
          echo "=== ZIP created ==="
          ls -lh "$ZIP_NAME"
          cat "$ZIP_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ClawbotCN-macOS-v*.zip
            ClawbotCN-macOS-v*.zip.sha256

  universal:
    needs: build
    runs-on: macos-14
    name: Create Universal
    timeout-minutes: 30

    env:
      VERSION: ${{ github.event.inputs.version || '2026.1.30' }}

    steps:
      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
        timeout-minutes: 10

      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: macos-x64
        timeout-minutes: 10

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -la
          echo "=== File sizes ==="
          du -sh * 2>/dev/null || true

      - name: Create Universal package
        run: |
          # Extract
          unzip -q "ClawbotCN-macOS-v$VERSION-arm64.zip"
          unzip -q "ClawbotCN-macOS-v$VERSION-x64.zip"
          
          ARM64_DIR="ClawbotCN-$VERSION-arm64"
          X64_DIR="ClawbotCN-$VERSION-x64"
          UNIVERSAL_DIR="ClawbotCN-$VERSION-universal"
          
          # Copy arm64 as base
          cp -r "$ARM64_DIR" "$UNIVERSAL_DIR"
          
          # Merge Node.js with lipo
          echo "Merging Node.js binaries..."
          lipo -create \
            "$ARM64_DIR/node/bin/node" \
            "$X64_DIR/node/bin/node" \
            -output "$UNIVERSAL_DIR/node/bin/node"
          
          # Verify
          file "$UNIVERSAL_DIR/node/bin/node"
          lipo -info "$UNIVERSAL_DIR/node/bin/node"
          
          # Update version.json
          cat > "$UNIVERSAL_DIR/version.json" << EOF
          {
            "version": "$VERSION",
            "variant": "lite",
            "platform": "darwin",
            "arch": "universal",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "nodeVersion": "22.13.0"
          }
          EOF
          
          # Create ZIP
          ZIP_NAME="ClawbotCN-macOS-v$VERSION-universal.zip"
          zip -r "$ZIP_NAME" "$UNIVERSAL_DIR" -x "*.DS_Store"
          shasum -a 256 "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"
          
          echo "=== Universal package created ==="
          ls -lh "$ZIP_NAME"

      - name: Upload Universal
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            ClawbotCN-macOS-v*-universal.zip
            ClawbotCN-macOS-v*-universal.zip.sha256

  test:
    needs: universal
    runs-on: macos-14
    name: Smoke Test

    env:
      VERSION: ${{ github.event.inputs.version || '2026.1.30' }}

    steps:
      - name: Download Universal
        uses: actions/download-artifact@v4
        with:
          name: macos-universal

      - name: Test package
        run: |
          unzip -q "ClawbotCN-macOS-v$VERSION-universal.zip"
          cd "ClawbotCN-$VERSION-universal"
          
          echo "=== Version ==="
          cat version.json
          
          echo "=== Node.js ==="
          ./node/bin/node --version
          
          echo "=== Architecture ==="
          file ./node/bin/node
          
          echo "=== CLI Help ==="
          ./node/bin/node ./app/dist/entry.js --help || echo "Help command done"
          
          echo "=== Test Complete ==="
