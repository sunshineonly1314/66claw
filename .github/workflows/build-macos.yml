name: Build macOS Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: true
        default: '2026.1.30'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            node_arch: arm64
          - arch: x64
            runner: macos-15
            node_arch: x64

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.arch }}

    env:
      VERSION: ${{ github.event.inputs.version || '2026.1.30' }}
      NODE_VERSION: '22.13.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.23.0 --activate

      - name: Install dependencies
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts=false || pnpm install --ignore-scripts=false

      - name: Build project
        run: pnpm build

      - name: Download Node.js for packaging
        run: |
          NODE_URL="https://nodejs.org/dist/v$NODE_VERSION/node-v$NODE_VERSION-darwin-${{ matrix.node_arch }}.tar.gz"
          echo "Downloading: $NODE_URL"
          curl -fsSL "$NODE_URL" -o node.tar.gz
          mkdir -p node-pkg
          tar -xzf node.tar.gz -C node-pkg --strip-components=1

      - name: Create package structure
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          mkdir -p "$PKG_DIR/app"
          mkdir -p "$PKG_DIR/node"
          mkdir -p "$PKG_DIR/config"
          
          # Copy Node.js
          cp -r node-pkg/* "$PKG_DIR/node/"
          
          # Copy app
          cp -r dist "$PKG_DIR/app/"
          
          # Create simplified package.json
          node -e "
          const pkg = require('./package.json');
          const newPkg = {
            name: pkg.name,
            version: pkg.version,
            type: pkg.type,
            main: pkg.main,
            dependencies: pkg.dependencies
          };
          console.log(JSON.stringify(newPkg, null, 2));
          " > "$PKG_DIR/app/package.json"
          
          # Copy extensions if exists
          if [ -d "extensions" ]; then
            cp -r extensions "$PKG_DIR/"
          fi
          
          # Copy sandbox config
          cp build/config/sandbox-mac.json "$PKG_DIR/config/" || echo "No sandbox config"

      - name: Install production dependencies
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          cd "$PKG_DIR/app"
          ../../node-pkg/bin/npm install --omit=dev --ignore-scripts || true
          cd ../..

      - name: Create launcher scripts
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          
          # CLI launcher
          cat > "$PKG_DIR/clawbotcn" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$SCRIPT_DIR/node/bin:$PATH"
          cd "$SCRIPT_DIR/app"
          exec node dist/entry.js "$@"
          EOF
          chmod +x "$PKG_DIR/clawbotcn"
          
          # GUI launcher
          cat > "$PKG_DIR/start-gui.command" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export PATH="$SCRIPT_DIR/node/bin:$PATH"
          echo "Starting ClawbotCN Gateway..."
          echo "URL: http://localhost:18789"
          (sleep 2 && open "http://localhost:18789/setup") &
          cd "$SCRIPT_DIR/app"
          exec node dist/entry.js gateway run --port 18789
          EOF
          chmod +x "$PKG_DIR/start-gui.command"
          
          # Install helper
          cat > "$PKG_DIR/install.sh" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          echo "Removing quarantine..."
          xattr -cr "$SCRIPT_DIR"
          chmod +x "$SCRIPT_DIR/clawbotcn"
          chmod +x "$SCRIPT_DIR/start-gui.command"
          chmod +x "$SCRIPT_DIR/node/bin/node"
          echo "Done! Double-click start-gui.command to run."
          EOF
          chmod +x "$PKG_DIR/install.sh"

      - name: Create version.json
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          cat > "$PKG_DIR/version.json" << EOF
          {
            "version": "$VERSION",
            "variant": "lite",
            "platform": "darwin",
            "arch": "${{ matrix.arch }}",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "nodeVersion": "$NODE_VERSION"
          }
          EOF

      - name: Create ZIP
        run: |
          PKG_DIR="ClawbotCN-$VERSION-${{ matrix.arch }}"
          ZIP_NAME="ClawbotCN-macOS-v$VERSION-${{ matrix.arch }}.zip"
          zip -r "$ZIP_NAME" "$PKG_DIR" -x "*.DS_Store"
          shasum -a 256 "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"
          ls -lh "$ZIP_NAME"
          cat "$ZIP_NAME.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            ClawbotCN-macOS-v*.zip
            ClawbotCN-macOS-v*.zip.sha256

  universal:
    needs: build
    runs-on: macos-14
    name: Create Universal

    env:
      VERSION: ${{ github.event.inputs.version || '2026.1.30' }}

    steps:
      - name: Download arm64
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64

      - name: Download x64
        uses: actions/download-artifact@v4
        with:
          name: macos-x64

      - name: Create Universal package
        run: |
          # Extract
          unzip -q "ClawbotCN-macOS-v$VERSION-arm64.zip"
          unzip -q "ClawbotCN-macOS-v$VERSION-x64.zip"
          
          ARM64_DIR="ClawbotCN-$VERSION-arm64"
          X64_DIR="ClawbotCN-$VERSION-x64"
          UNIVERSAL_DIR="ClawbotCN-$VERSION-universal"
          
          # Copy arm64 as base
          cp -r "$ARM64_DIR" "$UNIVERSAL_DIR"
          
          # Merge Node.js with lipo
          echo "Merging Node.js binaries..."
          lipo -create \
            "$ARM64_DIR/node/bin/node" \
            "$X64_DIR/node/bin/node" \
            -output "$UNIVERSAL_DIR/node/bin/node"
          
          # Verify
          file "$UNIVERSAL_DIR/node/bin/node"
          lipo -info "$UNIVERSAL_DIR/node/bin/node"
          
          # Update version.json
          cat > "$UNIVERSAL_DIR/version.json" << EOF
          {
            "version": "$VERSION",
            "variant": "lite",
            "platform": "darwin",
            "arch": "universal",
            "buildDate": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "nodeVersion": "22.13.0"
          }
          EOF
          
          # Create ZIP
          ZIP_NAME="ClawbotCN-macOS-v$VERSION-universal.zip"
          zip -r "$ZIP_NAME" "$UNIVERSAL_DIR" -x "*.DS_Store"
          shasum -a 256 "$ZIP_NAME" | awk '{print $1}' > "$ZIP_NAME.sha256"
          
          echo "=== Universal package created ==="
          ls -lh "$ZIP_NAME"

      - name: Upload Universal
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            ClawbotCN-macOS-v*-universal.zip
            ClawbotCN-macOS-v*-universal.zip.sha256

  test:
    needs: universal
    runs-on: macos-14
    name: Smoke Test

    env:
      VERSION: ${{ github.event.inputs.version || '2026.1.30' }}

    steps:
      - name: Download Universal
        uses: actions/download-artifact@v4
        with:
          name: macos-universal

      - name: Test package
        run: |
          unzip -q "ClawbotCN-macOS-v$VERSION-universal.zip"
          cd "ClawbotCN-$VERSION-universal"
          
          echo "=== Version ==="
          cat version.json
          
          echo "=== Node.js ==="
          ./node/bin/node --version
          
          echo "=== Architecture ==="
          file ./node/bin/node
          
          echo "=== CLI Help ==="
          ./node/bin/node ./app/dist/entry.js --help || echo "Help command done"
          
          echo "=== Test Complete ==="
