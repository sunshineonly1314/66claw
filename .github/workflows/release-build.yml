name: Release Build & Deploy

# 🚀 自动化打包流程：
# - 当推送到 main/master 分支且包含版本标签时自动触发
# - 当手动触发时可选择平台和模式
# - 自动构建 Windows/macOS/Linux 全平台包
# - 自动上传到 GitHub Releases

on:
  # 推送到主分支时自动触发（仅当有版本标签）
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
      - 'release-*'

  # 手动触发，支持自定义参数
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空则从 package.json 读取)'
        required: false
        default: ''
      platforms:
        description: '打包平台 (all/windows/macos/linux)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - windows
          - macos
          - linux
      windows_mode:
        description: 'Windows 打包模式'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - full
      macos_arch:
        description: 'macOS 架构'
        required: false
        default: 'universal'
        type: choice
        options:
          - universal
          - arm64
          - x64
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: true
        type: boolean
      run_tests:
        description: '运行冒烟测试'
        required: false
        default: true
        type: boolean

# 并发控制：同一分支只运行一次
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '10.23.0'

jobs:
  # ============================================================================
  # 准备阶段：解析版本号，决定是否需要构建
  # ============================================================================
  prepare:
    runs-on: ubuntu-latest
    name: Prepare Release
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_build_windows: ${{ steps.platforms.outputs.windows }}
      should_build_macos: ${{ steps.platforms.outputs.macos }}
      should_build_linux: ${{ steps.platforms.outputs.linux }}
      is_tag: ${{ steps.check.outputs.is_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check trigger type
        id: check
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
            echo "触发类型: Tag push"
          else
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
            echo "触发类型: Branch push or manual"
          fi

      - name: Resolve version
        id: version
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"

          if [ -n "$INPUT_VER" ]; then
            # 手动指定版本
            VERSION="$INPUT_VER"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # 从 tag 提取版本 (v1.2.3 -> 1.2.3)
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ github.ref }}" == refs/tags/release-* ]]; then
            # 从 release tag 提取版本 (release-1.2.3 -> 1.2.3)
            VERSION="${GITHUB_REF#refs/tags/release-}"
          else
            # 从 package.json 读取
            VERSION=$(node -p "require('./package.json').version")
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "✅ Release version: $VERSION"

      - name: Determine platforms
        id: platforms
        run: |
          PLATFORMS="${{ github.event.inputs.platforms || 'all' }}"

          if [ "$PLATFORMS" = "all" ]; then
            echo "windows=true" >> "$GITHUB_OUTPUT"
            echo "macos=true" >> "$GITHUB_OUTPUT"
            echo "linux=true" >> "$GITHUB_OUTPUT"
            echo "✅ Building all platforms"
          else
            echo "windows=$( [ "$PLATFORMS" = "windows" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "macos=$( [ "$PLATFORMS" = "macos" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "linux=$( [ "$PLATFORMS" = "linux" ] && echo true || echo false )" >> "$GITHUB_OUTPUT"
            echo "✅ Building platform: $PLATFORMS"
          fi

  # ============================================================================
  # Windows 构建任务
  # ============================================================================
  build-windows:
    needs: prepare
    if: needs.prepare.outputs.should_build_windows == 'true'
    runs-on: windows-latest
    name: Build Windows (${{ github.event.inputs.windows_mode || 'standard' }})
    timeout-minutes: 90

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MODE: ${{ github.event.inputs.windows_mode || 'standard' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Windows package
        run: |
          .\build\scripts\windows\build-windows.ps1 `
            -Mode ${{ env.MODE }} `
            -Version ${{ env.VERSION }} `
            -MaxThreads 8
        shell: pwsh

      - name: Smoke test
        if: github.event.inputs.run_tests != 'false'
        run: |
          $exePath = "E:\clawdbuild\ClawdbotCN-Setup-${{ env.VERSION }}-x64.exe"
          if (Test-Path $exePath) {
            Write-Host "✅ Installer created: $(Get-Item $exePath | Select-Object -ExpandProperty Length) bytes"
          } else {
            Write-Error "❌ Installer not found"
            exit 1
          }
        shell: pwsh

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ env.MODE }}-installer
          path: E:\clawdbuild\ClawdbotCN-Setup-*.exe
          retention-days: 30
          if-no-files-found: error

  # ============================================================================
  # macOS 构建任务
  # ============================================================================
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.should_build_macos == 'true'
    runs-on: macos-14
    name: Build macOS (${{ github.event.inputs.macos_arch || 'universal' }})
    timeout-minutes: 60

    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ARCH: ${{ github.event.inputs.macos_arch || 'universal' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build macOS DMG
        env:
          JOBS: 8
        run: |
          chmod +x build/scripts/build-macos-cn.sh
          bash build/scripts/build-macos-cn.sh \
            --arch ${{ env.ARCH }} \
            --jobs $JOBS

      - name: Smoke test
        if: github.event.inputs.run_tests != 'false'
        run: |
          DMG=$(ls build/output/ClawdbotCN-macOS-*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ DMG not found"
            exit 1
          fi
          echo "✅ DMG created: $(du -h "$DMG" | cut -f1)"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ env.ARCH }}-dmg
          path: |
            build/output/ClawdbotCN-macOS-*.dmg
            build/output/ClawdbotCN-macOS-*.dmg.sha256
          retention-days: 30
          if-no-files-found: error

  # ============================================================================
  # Linux 多架构并行构建
  # ============================================================================
  build-linux:
    needs: prepare
    if: needs.prepare.outputs.should_build_linux == 'true'
    runs-on: ubuntu-latest
    name: Build Linux (${{ matrix.target }})
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        target:
          - standalone-x64
          - standalone-arm64
          - deb-x64
          - rpm-x64

    env:
      VERSION: ${{ needs.prepare.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Linux package
        run: |
          chmod +x scripts/linux/build-all-parallel.sh
          bash scripts/linux/build-all-parallel.sh \
            --targets ${{ matrix.target }} \
            --jobs 4

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.target }}
          path: build/linux-release/*
          retention-days: 30

  # ============================================================================
  # 创建 GitHub Release
  # ============================================================================
  create-release:
    needs: [prepare, build-windows, build-macos, build-linux]
    if: |
      always() &&
      (needs.prepare.outputs.is_tag == 'true' || github.event.inputs.create_release == 'true') &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success' || needs.build-linux.result == 'success')
    runs-on: ubuntu-latest
    name: Create GitHub Release

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: |
          echo "📦 Downloaded artifacts:"
          ls -lhR artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: ClawdbotCN v${{ needs.prepare.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/**/*.exe
            artifacts/**/*.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm
            artifacts/**/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # 构建状态汇总
  # ============================================================================
  summary:
    needs: [prepare, build-windows, build-macos, build-linux, create-release]
    if: always()
    runs-on: ubuntu-latest
    name: Build Summary

    steps:
      - name: Generate summary
        run: |
          echo "# 🎉 Release Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 📋 Build Information" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ needs.prepare.outputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trigger | ${{ github.event_name }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | ${{ github.ref }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## 🏗️ Build Results" >> "$GITHUB_STEP_SUMMARY"
          echo "| Platform | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Windows | ${{ needs.build-windows.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| macOS | ${{ needs.build-macos.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Linux | ${{ needs.build-linux.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${{ needs.create-release.result || 'skipped' }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # 构建状态徽章
          if [ "${{ needs.build-windows.result }}" = "success" ] || \
             [ "${{ needs.build-macos.result }}" = "success" ] || \
             [ "${{ needs.build-linux.result }}" = "success" ]; then
            echo "✅ **Build completed successfully!**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ **Build failed or was skipped**" >> "$GITHUB_STEP_SUMMARY"
          fi
