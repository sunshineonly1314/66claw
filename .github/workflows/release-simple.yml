name: Simple Release Deploy

# 🚀 超简版自动更新部署
# 功能:
#   1. 构建加密包
#   2. 打包完整安装包
#   3. SSH 上传到服务器
#   4. 更新 latest.json
#
# 触发: git push tag (如: v2026.2.18)

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy

    steps:
      # ============================================================
      # 1. 准备代码
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        run: npm install -g pnpm@9

      # ============================================================
      # 2. 配置中国镜像源 (加速依赖安装)
      # ============================================================
      - name: Configure China mirrors
        run: |
          echo "📦 配置中国镜像源..."
          pnpm config set registry https://registry.npmmirror.com
          echo "✅ 已切换到淘宝 npm 镜像"

      - name: Install dependencies
        run: |
          echo "📥 安装依赖..."
          pnpm install --frozen-lockfile

      # ============================================================
      # 3. 构建加密包
      # ============================================================
      - name: Build with encryption
        run: |
          echo "🔨 构建加密包..."
          pnpm build:secure
        env:
          NODE_ENV: production

      # ============================================================
      # 4. 获取版本号
      # ============================================================
      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Version: $VERSION"

      # ============================================================
      # 5. 生成 manifest.json
      # ============================================================
      - name: Generate manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}

          # 统计文件数量
          FILE_COUNT=$(find dist -type f | wc -l)

          # 生成 manifest
          cat > manifest.json <<EOF
          {
            "version": "$VERSION",
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gitCommit": "${GITHUB_SHA:0:9}",
            "files": {
              "total": $FILE_COUNT,
              "encrypted": $(find dist -name "*.jsc" | wc -l)
            },
            "changelog": {
              "zh-CN": "版本 $VERSION 更新",
              "en-US": "Version $VERSION update"
            }
          }
          EOF

          echo "✅ Manifest 生成完成"
          cat manifest.json

      # ============================================================
      # 6. 打包完整安装包
      # ============================================================
      - name: Create package
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "📦 打包完整安装包..."

          tar -czf full.tar.gz \
            dist/ \
            package.json \
            skills/ \
            extensions/ \
            --exclude=node_modules \
            --exclude=.git \
            --exclude='*.log' \
            --exclude='.update-temp' \
            --exclude='.backups'

          SIZE=$(ls -lh full.tar.gz | awk '{print $5}')
          echo "✅ 打包完成: full.tar.gz ($SIZE)"

      # ============================================================
      # 7. 准备部署文件
      # ============================================================
      - name: Prepare deployment
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PROTOCOL=${{ secrets.UPDATE_SERVER_PROTOCOL || 'http' }}
          HOST=${{ secrets.UPDATE_SERVER_HOST }}

          mkdir -p deploy/$VERSION

          # 复制文件
          cp manifest.json deploy/$VERSION/
          cp full.tar.gz deploy/$VERSION/

          # 生成 latest.json
          cat > deploy/latest.json <<EOF
          {
            "version": "$VERSION",
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gitCommit": "${GITHUB_SHA:0:9}",
            "url": "${PROTOCOL}://${HOST}/releases/${VERSION}/full.tar.gz"
          }
          EOF

          echo "✅ 部署文件准备完成"
          ls -lh deploy/$VERSION/

      # ============================================================
      # 8. 部署到服务器 (SSH + SCP)
      # ============================================================
      - name: Deploy to server
        env:
          HOST: ${{ secrets.UPDATE_SERVER_HOST }}
          USER: ${{ secrets.UPDATE_SERVER_USER }}
          KEY: ${{ secrets.UPDATE_SERVER_SSH_KEY }}
          PORT: ${{ secrets.UPDATE_SERVER_PORT || '22' }}
        run: |
          VERSION=${{ steps.version.outputs.version }}

          echo "🔐 配置 SSH..."
          mkdir -p ~/.ssh
          echo "$KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p $PORT -H $HOST >> ~/.ssh/known_hosts 2>/dev/null

          echo "📤 上传文件到服务器..."
          echo "   目标: $USER@$HOST:/var/www/updates/releases/"

          # 上传版本目录
          scp -P $PORT -r deploy/$VERSION $USER@$HOST:/var/www/updates/releases/

          # 更新 latest.json
          scp -P $PORT deploy/latest.json $USER@$HOST:/var/www/updates/releases/

          echo "✅ 部署完成!"

      # ============================================================
      # 9. 验证部署
      # ============================================================
      - name: Verify deployment
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PROTOCOL=${{ secrets.UPDATE_SERVER_PROTOCOL || 'http' }}
          HOST=${{ secrets.UPDATE_SERVER_HOST }}

          echo "🔍 验证部署..."

          # 等待 Nginx 刷新
          sleep 2

          # 检查 latest.json
          echo "检查 latest.json:"
          curl -f -s ${PROTOCOL}://${HOST}/releases/latest.json | jq . || echo "⚠️ latest.json 无法访问"

          # 检查 manifest.json
          echo "检查 manifest.json:"
          curl -f -s ${PROTOCOL}://${HOST}/releases/${VERSION}/manifest.json | jq . || echo "⚠️ manifest.json 无法访问"

          # 检查完整包
          echo "检查完整包:"
          STATUS=$(curl -I -s ${PROTOCOL}://${HOST}/releases/${VERSION}/full.tar.gz | grep "HTTP" | awk '{print $2}')
          if [ "$STATUS" = "200" ]; then
            echo "✅ 完整包可访问"
          else
            echo "⚠️ 完整包无法访问 (HTTP $STATUS)"
          fi

          echo "✅ 验证完成!"

      # ============================================================
      # 10. 创建 GitHub Release (可选)
      # ============================================================
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: full.tar.gz
          body: |
            ## 版本 ${{ steps.version.outputs.version }}

            ### 下载地址
            ${{ secrets.UPDATE_SERVER_PROTOCOL || 'http' }}://${{ secrets.UPDATE_SERVER_HOST }}/releases/${{ steps.version.outputs.version }}/full.tar.gz

            ### 自动更新
            客户端会自动检测此版本并提示更新。

            ---
            🤖 由 GitHub Actions 自动构建
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ============================================================
      # 11. 通知 (可选)
      # ============================================================
      - name: Notify success
        if: success()
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo ""
          echo "========================================="
          echo "  🎉 版本 v$VERSION 发布成功!"
          echo "========================================="
          echo ""
          echo "更新地址:"
          echo "  ${{ secrets.UPDATE_SERVER_PROTOCOL || 'http' }}://${{ secrets.UPDATE_SERVER_HOST }}/releases/$VERSION/"
          echo ""
          echo "用户可通过以下命令更新:"
          echo "  openclawcn update --check"
          echo "  openclawcn update --apply"
          echo ""

      - name: Notify failure
        if: failure()
        run: |
          echo ""
          echo "========================================="
          echo "  ❌ 部署失败!"
          echo "========================================="
          echo ""
          echo "请检查:"
          echo "  1. GitHub Secrets 是否配置正确"
          echo "  2. SSH 密钥是否有效"
          echo "  3. 服务器目录权限是否正确"
          echo "  4. Nginx 是否正常运行"
          echo ""
