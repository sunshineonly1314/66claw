name: Release Build with Auto-Update Deploy

# 🚀 在现有 release-build.yml 的基础上增加自动更新部署功能
# 当版本发布时:
# 1. 构建加密包
# 2. 生成增量更新包
# 3. 部署到更新服务器
# 4. 创建 GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'release-*'

  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (留空则从 package.json 读取)'
        required: false
        default: ''
      deploy_to_update_server:
        description: '部署到更新服务器'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-update-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.14.0'
  PNPM_VERSION: '10.23.0'

jobs:
  # ============================================================================
  # Job 1: 构建加密包 + 生成更新元数据
  # ============================================================================
  build-and-package:
    runs-on: ubuntu-latest
    name: Build Encrypted Package

    outputs:
      version: ${{ steps.version.outputs.version }}
      prev_version: ${{ steps.prev.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史用于查找上一个版本

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(node -p "require('./package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Version: $VERSION"

      - name: Get previous version
        id: prev
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            PREV_VERSION="${PREV_TAG#v}"
            echo "version=$PREV_VERSION" >> "$GITHUB_OUTPUT"
            echo "📜 Previous version: $PREV_VERSION"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "⚠️ No previous version found"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build with encryption
        run: |
          echo "🔨 Building with CN encryption..."
          pnpm build:secure
        env:
          NODE_ENV: production

      - name: Generate manifest and checksums
        run: |
          echo "📝 Generating manifest..."
          node --import tsx scripts/generate-manifest.ts

      - name: Create full package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "📦 Creating full package for v$VERSION"

          tar -czf full-package.tar.gz \
            dist/ \
            package.json \
            skills/ \
            extensions/ \
            --exclude=node_modules \
            --exclude=.git \
            --exclude=*.log

          ls -lh full-package.tar.gz

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            dist/
            manifest.json
            checksums.json
            full-package.tar.gz
          retention-days: 7

  # ============================================================================
  # Job 2: 生成增量包
  # ============================================================================
  generate-delta:
    runs-on: ubuntu-latest
    name: Generate Delta Package
    needs: build-and-package
    if: needs.build-and-package.outputs.prev_version != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Download current build
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build-and-package.outputs.version }}
          path: current/

      - name: Download previous version
        run: |
          PREV_VERSION="${{ needs.build-and-package.outputs.prev_version }}"
          echo "⬇️ Downloading previous version: v$PREV_VERSION"

          mkdir -p prev-release

          # 尝试从更新服务器下载
          if curl -f -L "https://${{ secrets.UPDATE_SERVER_HOST }}/releases/${PREV_VERSION}/full-package.tar.gz" \
            -o prev-release/full-package.tar.gz 2>/dev/null; then
            echo "✅ Downloaded from update server"
          # 尝试从 GitHub Releases 下载
          elif gh release download "v${PREV_VERSION}" \
            -p "full-package.tar.gz" \
            -D prev-release/ 2>/dev/null; then
            echo "✅ Downloaded from GitHub Releases"
          else
            echo "⚠️ Previous version not found, will skip delta generation"
            echo "SKIP_DELTA=1" >> $GITHUB_ENV
            exit 0
          fi

          cd prev-release
          tar -xzf full-package.tar.gz
          cd ..
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install delta generator dependencies
        if: env.SKIP_DELTA != '1'
        run: pnpm install --frozen-lockfile

      - name: Generate delta package
        if: env.SKIP_DELTA != '1'
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          PREV_VERSION="${{ needs.build-and-package.outputs.prev_version }}"

          echo "🔄 Generating delta from v$PREV_VERSION to v$VERSION"

          node --import tsx scripts/generate-delta-package.ts \
            --from prev-release/dist \
            --to current/dist \
            --output delta-from-${PREV_VERSION}

          # 打包增量包
          tar -czf delta-from-${PREV_VERSION}.tar.gz \
            delta-from-${PREV_VERSION}/

          ls -lh delta-from-${PREV_VERSION}.tar.gz

      - name: Upload delta artifact
        if: env.SKIP_DELTA != '1'
        uses: actions/upload-artifact@v4
        with:
          name: delta-${{ needs.build-and-package.outputs.prev_version }}-to-${{ needs.build-and-package.outputs.version }}
          path: delta-from-${{ needs.build-and-package.outputs.prev_version }}/
          retention-days: 7

  # ============================================================================
  # Job 3: 部署到更新服务器
  # ============================================================================
  deploy-to-update-server:
    runs-on: ubuntu-latest
    name: Deploy to Update Server
    needs: [build-and-package, generate-delta]
    if: |
      always() &&
      (needs.build-and-package.result == 'success') &&
      (needs.generate-delta.result == 'success' || needs.generate-delta.result == 'skipped') &&
      (github.event.inputs.deploy_to_update_server != 'false')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build-and-package.outputs.version }}
          path: build/

      - name: Download delta (if exists)
        if: needs.build-and-package.outputs.prev_version != ''
        uses: actions/download-artifact@v4
        with:
          name: delta-${{ needs.build-and-package.outputs.prev_version }}-to-${{ needs.build-and-package.outputs.version }}
          path: delta/
        continue-on-error: true

      - name: Prepare deployment files
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          PREV_VERSION="${{ needs.build-and-package.outputs.prev_version }}"

          mkdir -p deploy/${VERSION}

          # 复制构建文件
          cp build/manifest.json deploy/${VERSION}/
          cp build/checksums.json deploy/${VERSION}/
          cp build/full-package.tar.gz deploy/${VERSION}/
          cp -r build/dist deploy/${VERSION}/

          # 复制增量包 (如果存在)
          if [ -d "delta" ] && [ -n "$PREV_VERSION" ]; then
            mkdir -p deploy/${VERSION}/delta-from-${PREV_VERSION}
            cp -r delta/* deploy/${VERSION}/delta-from-${PREV_VERSION}/
            echo "✅ Delta package prepared"
          fi

          # 生成 latest.json
          cat > deploy/latest.json <<EOF
          {
            "version": "${VERSION}",
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gitCommit": "${GITHUB_SHA:0:9}",
            "downloadUrl": "https://${{ secrets.UPDATE_SERVER_HOST }}/releases/${VERSION}/full-package.tar.gz"
          }
          EOF

          # 显示部署文件结构
          echo "📁 Deployment structure:"
          tree deploy || ls -R deploy

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.UPDATE_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to server via rsync
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          SERVER_USER="${{ secrets.SERVER_USER }}"
          SERVER_HOST="${{ secrets.UPDATE_SERVER_HOST }}"
          SERVER_PATH="/var/www/openclawcn-updates/releases"

          echo "📤 Deploying to $SERVER_USER@$SERVER_HOST:$SERVER_PATH"

          # 同步版本目录
          rsync -avz --progress \
            deploy/${VERSION}/ \
            ${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/${VERSION}/

          # 更新 latest.json
          rsync -avz \
            deploy/latest.json \
            ${SERVER_USER}@${SERVER_HOST}:${SERVER_PATH}/

          echo "✅ Deployment completed!"

      - name: Verify deployment
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          SERVER_HOST="${{ secrets.UPDATE_SERVER_HOST }}"

          echo "🔍 Verifying deployment..."

          # 检查 latest.json
          curl -f https://${SERVER_HOST}/releases/latest.json | jq .

          # 检查 manifest.json
          curl -f https://${SERVER_HOST}/releases/${VERSION}/manifest.json | jq .

          echo "✅ Deployment verified!"

      - name: Notify deployment success
        if: success()
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          echo "🎉 Version v$VERSION has been deployed to update server!"

          # 可以在这里添加通知逻辑:
          # - 企业微信
          # - 钉钉
          # - Slack
          # - 邮件

  # ============================================================================
  # Job 4: 创建 GitHub Release
  # ============================================================================
  create-github-release:
    runs-on: ubuntu-latest
    name: Create GitHub Release
    needs: [build-and-package, deploy-to-update-server]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build-and-package.outputs.version }}
          path: artifacts/

      - name: Read changelog
        id: changelog
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"

          # 从 CHANGELOG.md 提取最新版本的更新内容
          if [ -f "CHANGELOG.md" ]; then
            sed -n "/## \[${VERSION}\]/,/## \[/p" CHANGELOG.md | sed '1d;$d' > release-notes.md
          else
            echo "无更新日志" > release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/full-package.tar.gz
          body_path: release-notes.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on related issues
        run: |
          VERSION="${{ needs.build-and-package.outputs.version }}"
          echo "📝 Version v$VERSION has been released!"

          # 可以自动在相关 Issue 中评论
          # gh issue comment <issue-number> --body "已在 v$VERSION 中修复"
