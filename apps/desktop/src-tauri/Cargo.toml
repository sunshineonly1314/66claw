[package]
name = "clawdbot-desktop"
version = "0.1.0"
description = "ClawdbotCN Cross-Platform Desktop Application"
authors = ["Clawdbot Team"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "clawdbot_desktop_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"  # Required by tauri::generate_context!()
dirs = "5"
