<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClawbotCN 控制台</title>
    <meta name="description" content="ClawbotCN - 智能 AI 助手控制台，由 tecbinai 提供技术支持" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>
  <body>
    <div id="__loading__" style="position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(135deg,#0f0f1a 0%,#1a1a2e 50%,#16213e 100%);color:#e0e0e0;margin:0;overflow:hidden">
      <style>@keyframes __spin{to{transform:rotate(360deg)}}@keyframes __pulse{0%,100%{opacity:.6}50%{opacity:1}}@keyframes __fadeDots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}</style>
      <div id="__spinner__" style="width:48px;height:48px;border:3px solid rgba(74,108,247,0.2);border-top-color:#4a6cf7;border-radius:50%;animation:__spin 0.8s linear infinite;margin-bottom:28px"></div>
      <div id="__loading_text__" style="font-size:15px;color:#8892b0;animation:__pulse 2s ease-in-out infinite;letter-spacing:0.5px">正在启动服务...</div>
      <div id="__loading_sub__" style="font-size:12px;color:#4a5568;margin-top:12px">ClawdbotCN AI</div>
    </div>
    <clawdbot-app></clawdbot-app>
    <script>
      // Loading screen management — Desktop (Tauri) vs Browser mode
      var _lo=document.getElementById('__loading__');
      if(_lo){
        var _removed=false;
        var _isDesktop=window.location.hostname==='tauri.localhost';
        var _startTime=Date.now();
        var _ob=null;
        var _statusTimer=0;

        function _fadeOutLoading(){
          if(_removed)return;
          _removed=true;
          _lo.style.transition='opacity 0.3s';
          _lo.style.opacity='0';
          setTimeout(function(){_lo.remove()},300);
          if(_ob)_ob.disconnect();
          clearInterval(_pi);
          clearInterval(_statusTimer);
        }

        if(_isDesktop){
          // Desktop mode: poll gateway health and redirect to gateway HTTP URL.
          // This handles both initial load and F5 refresh — the embedded
          // tauri.localhost UI is just a loading screen that auto-redirects.
          var _gwPort=19002;
          function _pollGateway(){
            fetch('http://127.0.0.1:'+_gwPort+'/api/health',{signal:AbortSignal.timeout(3000)})
              .then(function(r){return r.json()})
              .then(function(d){
                if(!d.ready){setTimeout(_pollGateway,500);return}
                // Gateway ready — get token from Tauri IPC or fall back to config
                var invoke=(window.__TAURI_INTERNALS__&&window.__TAURI_INTERNALS__.invoke)||(window.__TAURI__&&window.__TAURI__.core&&window.__TAURI__.core.invoke);
                if(invoke){
                  invoke('get_gateway_info').then(function(info){
                    var hash=info.token?'#token='+info.token+'&gatewayUrl=ws%3A%2F%2F127.0.0.1%3A'+info.port:'';
                    window.location.href='http://127.0.0.1:'+info.port+'/'+hash;
                  }).catch(function(){
                    window.location.href='http://127.0.0.1:'+_gwPort+'/';
                  });
                }else{
                  window.location.href='http://127.0.0.1:'+_gwPort+'/';
                }
              })
              .catch(function(){setTimeout(_pollGateway,500)});
          }
          // If hash already has token (Rust already injected), redirect immediately
          if(window.location.hash.indexOf('token=')!==-1){
            var _hp=new URLSearchParams(window.location.hash.slice(1));
            var _tk=_hp.get('token');
            var _gu=_hp.get('gatewayUrl');
            window.location.href='http://127.0.0.1:'+_gwPort+'/#token='+_tk+(_gu?'&gatewayUrl='+encodeURIComponent(_gu):'');
          }else{
            setTimeout(_pollGateway,300);
          }
          // Update status text based on elapsed time
          var _statusTimer=setInterval(function(){
            var elapsed=Date.now()-_startTime;
            var txt=document.getElementById('__loading_text__');
            var sub=document.getElementById('__loading_sub__');
            if(!txt)return;
            if(elapsed>45000){
              txt.textContent='启动时间较长，如长时间无响应请重启应用';
              txt.style.color='#f87171';
              if(sub)sub.textContent='可能是杀毒软件拦截了 node.exe';
            }else if(elapsed>20000){
              txt.textContent='服务启动中，请耐心等待...';
              txt.style.color='#fbbf24';
            }else if(elapsed>8000){
              txt.textContent='正在初始化后台服务...';
            }
          },2000);
          // Safety: force remove after 90s (matches Rust timeout)
          setTimeout(function(){if(!_removed)_fadeOutLoading()},90000);
        }else{
          // Browser mode: remove loading once app component has rendered content
          function _tryRemove(){
            if(_removed)return;
            var app=document.querySelector('clawdbot-app');
            if(!app)return;
            var hasContent=(app.shadowRoot&&app.shadowRoot.children.length>0)||app.children.length>0;
            if(hasContent)_fadeOutLoading();
          }
          _ob=new MutationObserver(_tryRemove);
          _ob.observe(document.body,{childList:true,subtree:true});
          setTimeout(function(){if(!_removed&&_lo.parentNode)_fadeOutLoading()},10000);
        }
        var _pi=setInterval(function(){if(!_isDesktop){var app=document.querySelector('clawdbot-app');if(app){var c=(app.shadowRoot&&app.shadowRoot.children.length>0)||app.children.length>0;if(c)_fadeOutLoading()}}},100);
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
