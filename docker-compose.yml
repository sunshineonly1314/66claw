# Clawdbot Docker Compose 配置
# 支持环境变量自动配置，无需手动编辑配置文件
#
# 使用方法:
# 1. 复制 .env.example 为 .env
# 2. 编辑 .env 填写配置
# 3. docker-compose up -d

version: "3.8"

services:
  clawdbot-gateway:
    image: clawdbot/gateway:latest
    container_name: clawdbot-gateway
    restart: unless-stopped
    ports:
      - "${CLAWDBOT_GATEWAY_PORT:-18789}:18789"
    volumes:
      - clawdbot-data:/home/node/.clawdbot
      - clawdbot-workspace:/home/node/.clawdbot/workspace
    environment:
      # AI 模型配置
      - CLAWDBOT_MODEL_ID=${CLAWDBOT_MODEL_ID:-}
      - CLAWDBOT_MODEL_PROVIDER=${CLAWDBOT_MODEL_PROVIDER:-}
      - CLAWDBOT_BASE_URL=${CLAWDBOT_BASE_URL:-}
      - CLAWDBOT_API_KEY=${CLAWDBOT_API_KEY:-}
      
      # Gateway 配置
      - CLAWDBOT_GATEWAY_TOKEN=${CLAWDBOT_GATEWAY_TOKEN:-}
      - CLAWDBOT_GATEWAY_PASSWORD=${CLAWDBOT_GATEWAY_PASSWORD:-}
      - CLAWDBOT_GATEWAY_BIND=${CLAWDBOT_GATEWAY_BIND:-lan}
      - CLAWDBOT_GATEWAY_PORT=${CLAWDBOT_GATEWAY_PORT:-18789}
      
      # 飞书配置
      - CLAWDBOT_FEISHU_APP_ID=${CLAWDBOT_FEISHU_APP_ID:-}
      - CLAWDBOT_FEISHU_APP_SECRET=${CLAWDBOT_FEISHU_APP_SECRET:-}
      - CLAWDBOT_FEISHU_MODE=${CLAWDBOT_FEISHU_MODE:-websocket}
      - CLAWDBOT_FEISHU_DOMAIN=${CLAWDBOT_FEISHU_DOMAIN:-feishu}
      
      # 钉钉配置
      - CLAWDBOT_DINGTALK_APP_KEY=${CLAWDBOT_DINGTALK_APP_KEY:-}
      - CLAWDBOT_DINGTALK_APP_SECRET=${CLAWDBOT_DINGTALK_APP_SECRET:-}
      - CLAWDBOT_DINGTALK_ROBOT_CODE=${CLAWDBOT_DINGTALK_ROBOT_CODE:-}
      - CLAWDBOT_DINGTALK_MODE=${CLAWDBOT_DINGTALK_MODE:-stream}
      
      # 企业微信配置
      - CLAWDBOT_WECOM_CORP_ID=${CLAWDBOT_WECOM_CORP_ID:-}
      - CLAWDBOT_WECOM_AGENT_ID=${CLAWDBOT_WECOM_AGENT_ID:-}
      - CLAWDBOT_WECOM_AGENT_SECRET=${CLAWDBOT_WECOM_AGENT_SECRET:-}
      - CLAWDBOT_WECOM_TOKEN=${CLAWDBOT_WECOM_TOKEN:-}
      - CLAWDBOT_WECOM_ENCODING_AES_KEY=${CLAWDBOT_WECOM_ENCODING_AES_KEY:-}
      
      # QQ 机器人配置
      - CLAWDBOT_QQBOT_APP_ID=${CLAWDBOT_QQBOT_APP_ID:-}
      - CLAWDBOT_QQBOT_APP_SECRET=${CLAWDBOT_QQBOT_APP_SECRET:-}
      - CLAWDBOT_QQBOT_TOKEN=${CLAWDBOT_QQBOT_TOKEN:-}
      - CLAWDBOT_QQBOT_SANDBOX=${CLAWDBOT_QQBOT_SANDBOX:-false}
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  clawdbot-data:
    name: clawdbot-data
  clawdbot-workspace:
    name: clawdbot-workspace
